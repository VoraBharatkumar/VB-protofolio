<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web3Forms Browser Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .result { margin: 1rem 0; padding: 1rem; border-radius: 8px; }
    .success { background: #d4edda; border: 1px solid #28a745; }
    .error { background: #f8d7da; border: 1px solid #dc3545; }
    .info { background: #d1ecf1; border: 1px solid #17a2b8; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Web3Forms Browser Submission Test</h1>
  <p>This page tests direct browser submission to Web3Forms using FormData.</p>
  
  <div id="status" class="result info">Ready to test...</div>
  
  <script>
    const ACCESS_KEY = '79d8e164-9c00-4836-83f5-72a4f2cb47ab';
    
    async function testSubmission() {
      const statusDiv = document.getElementById('status');
      
      statusDiv.className = 'result info';
      statusDiv.innerHTML = 'Submitting test to Web3Forms...';
      
      const formData = new FormData();
      formData.append('access_key', ACCESS_KEY);
      formData.append('name', 'Browser Test User');
      formData.append('email', 'browser-test@example.com');
      formData.append('company', 'Test Corp');
      formData.append('budget', '$15k-$30k');
      formData.append('message', 'Test submission from browser diagnostic page');
      formData.append('subject', 'New Executive Inquiry from Browser Test User');
      formData.append('from_name', 'Executive Contact Form');
      
      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData,
        });
        
        const responseText = await response.text();
        
        let result;
        try {
          result = JSON.parse(responseText);
        } catch (e) {
          result = { success: false, raw: responseText };
        }
        
        statusDiv.className = response.ok && result.success ? 'result success' : 'result error';
        statusDiv.innerHTML = `
          <strong>HTTP Status:</strong> ${response.status} ${response.statusText}<br>
          <strong>Web3Forms Success:</strong> ${result.success}<br>
          <strong>Response:</strong><br>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
        
        console.log('Full response:', {
          status: response.status,
          statusText: response.statusText,
          headers: Object.fromEntries(response.headers.entries()),
          body: responseText,
          parsed: result
        });
        
      } catch (error) {
        statusDiv.className = 'result error';
        statusDiv.innerHTML = `<strong>Error:</strong> ${error.message}<br><pre>${error.stack}</pre>`;
        console.error('Submission error:', error);
      }
    }
    
    // Auto-run test on page load
    testSubmission();
  </script>
</body>
</html>
